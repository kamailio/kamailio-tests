---
name: checks_pr
'on':
  pull_request:
    branches:
      - master
jobs:
  depth-value:
    runs-on: ubuntu-latest
    steps:
      - name: Calculate depth from Pull-Request commits
        id: set_value
        run: |
          val=$(( ${{ github.event.pull_request.commits }} + 1 ))
          echo "val is $val"
          echo "result=$val" >> "$GITHUB_OUTPUT"
    outputs:
      pr_depth: ${{ steps.set_value.outputs.result }}
  check-commit:
    runs-on: ubuntu-latest
    needs: depth-value
    permissions:
      contents: read # to fetch code (actions/checkout)
    steps:
      - name: Check out the repository to the runner
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ needs.depth-value.outputs.pr_depth }}
      - uses: actions/setup-python@v7
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --from-ref ${{ github.event.pull_request.base.sha }} --to-ref ${{ github.sha }}
