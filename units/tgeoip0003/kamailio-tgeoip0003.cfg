#!KAMAILIO
#
# geoip2.reload with a generated test database (tgeoip0003)
#
# The request says what to do in headers, the result comes back in the
# X-Geo reply header:
#   X-Op: match (default)  - geoip2_match($hdr(X-IP), "src")
#   X-Op: two              - X-IP into "src", X-IP2 into "dst"
#   X-Op: si               - geoip2_match("$si", "src")
#   X-Op: repeat           - X-IP2 then X-IP into the same container
#   X-Op: dist             - geoip2_distance(X-IP, X-Lat, X-Lon)
#   X-Op: regn             - only $gip2(src=>regn)
#   X-Op: nmask            - only $gip2(src=>nmask)
#

debug=2
log_stderror=yes
fork=yes
children=2
auto_aliases=no

listen=udp:127.0.0.1:5060

loadmodule "sl.so"
loadmodule "pv.so"
loadmodule "textops.so"
loadmodule "xlog.so"
loadmodule "ctl.so"
loadmodule "geoip2.so"

modparam("geoip2", "path", "__MMDB__")

request_route {
	if(is_present_hf("X-Op")) {
		$var(op) = $hdr(X-Op);
	} else {
		$var(op) = "match";
	}

	if($var(op) == "dist") {
		$var(d) = geoip2_distance("$hdr(X-IP)", "$hdr(X-Lat)", "$hdr(X-Lon)");
		append_to_reply("X-Geo: dist=$var(d)\r\n");
		sl_send_reply("200", "OK");
		exit;
	}

	if($var(op) == "regn") {
		# only regn: it shares a cache flag with contc, read it alone
		if(!geoip2_match("$hdr(X-IP)", "src")) {
			sl_send_reply("404", "No Match");
			exit;
		}
		append_to_reply("X-Geo: regn=$gip2(src=>regn)\r\n");
		sl_send_reply("200", "OK");
		exit;
	}

	if($var(op) == "nmask") {
		if(!geoip2_match("$hdr(X-IP)", "src")) {
			sl_send_reply("404", "No Match");
			exit;
		}
		append_to_reply("X-Geo: nmask=$gip2(src=>nmask)\r\n");
		sl_send_reply("200", "OK");
		exit;
	}

	if($var(op) == "two") {
		if(!geoip2_match("$hdr(X-IP)", "src") || !geoip2_match("$hdr(X-IP2)", "dst")) {
			sl_send_reply("404", "No Match");
			exit;
		}
		append_to_reply("X-Geo: src=$gip2(src=>cc);dst=$gip2(dst=>cc)\r\n");
		sl_send_reply("200", "OK");
		exit;
	}

	if($var(op) == "si") {
		$var(ip) = $si;
	} else {
		$var(ip) = $hdr(X-IP);
	}

	if($var(op) == "repeat") {
		geoip2_match("$hdr(X-IP2)", "src");
	}

	if(!geoip2_match("$var(ip)", "src")) {
		sl_send_reply("404", "No Match");
		exit;
	}
	append_to_reply("X-Geo: cc=$gip2(src=>cc);contc=$gip2(src=>contc);city=$gip2(src=>city);regc=$gip2(src=>regc);zip=$gip2(src=>zip);tz=$gip2(src=>tz);lat=$gip2(src=>lat);lon=$gip2(src=>lon);metro=$gip2(src=>metro)\r\n");
	sl_send_reply("200", "OK");
	exit;
}
