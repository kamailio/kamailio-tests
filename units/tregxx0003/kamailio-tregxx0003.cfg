#!KAMAILIO

children=1
listen=udp:127.0.0.1:5060

loadmodule "sl.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"

modparam("registrar", "outbound_mode", 1)
modparam("registrar", "use_path", 1)

request_route {
    if (method == "REGISTER") {
        save("location");
        exit;
    }
    # any other request reports if the AoR in R-URI has bindings
    if (registered("location")) {
        sl_send_reply("200", "Registered");
    } else {
        sl_send_reply("404", "Not Registered");
    }
    exit;
}
