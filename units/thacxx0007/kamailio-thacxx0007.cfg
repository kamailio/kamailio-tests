#!KAMAILIO

#!trydef HAC_CA_PATH "/tmp"

debug=2
children=1

loadmodule "tm.so"
loadmodule "pv.so"
loadmodule "xlog.so"
loadmodule "ctl.so"
loadmodule "htable.so"
loadmodule "rtimer.so"
loadmodule "http_async_client.so"

modparam("htable", "htable", "ctl=>size=4;")
modparam("rtimer", "timer", "name=drv;interval=100000u;mode=1;")
modparam("rtimer", "exec", "timer=drv;route=DRIVE")
modparam("http_async_client", "workers", 1)
modparam("http_async_client", "connection_timeout", 2000)
modparam("http_async_client", "tls_verify_peer", 1)
modparam("http_async_client", "tls_verify_host", 1)
modparam("http_async_client", "tls_ca_path", HAC_CA_PATH)

request_route {
	drop;
}

event_route[htable:mod-init] {
	$sht(ctl=>ok) = 0;
	$sht(ctl=>fail) = 0;
}

# every 100 ms: send $sht(ctl=>burst) queries at once, and one query
# while $sht(ctl=>trickle) > 0
route[DRIVE] {
	$var(n) = $sht(ctl=>burst);
	if($var(n) > 0) {
		$sht(ctl=>burst) = 0;
		while($var(n) > 0) {
			http_async_query("https://localhost:8443/", "HTTP_REPLY");
			$var(n) = $var(n) - 1;
		}
	}
	if($sht(ctl=>trickle) > 0) {
		$sht(ctl=>trickle) = $sht(ctl=>trickle) - 1;
		http_async_query("https://localhost:8443/", "HTTP_REPLY");
	}
}

route[HTTP_REPLY] {
	if($http_ok && $http_rs == 200) {
		$var(x) = $shtinc(ctl=>ok);
	} else {
		$var(x) = $shtinc(ctl=>fail);
		xlog("L_ERR", "HTTP error: ok=$http_ok rs=$http_rs err=$http_err\n");
	}
}
