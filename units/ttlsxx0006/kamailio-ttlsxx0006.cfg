#!KAMAILIO
#
# TLS SNI server domain selection unit test (ttlsxx0006)
#

debug=2
log_stderror=yes
fork=yes
children=2
auto_aliases=no

listen=tls:127.0.0.1:5061

enable_tls=yes

loadmodule "sl.so"
loadmodule "pv.so"
loadmodule "textops.so"
loadmodule "tls.so"

modparam("tls", "config", "__TLS_CFG__")

request_route {
	if($rm == "OPTIONS") {
		append_to_reply("X-SNI: $tls_peer_server_name\r\n");
		append_to_reply("X-My-CN: $tls_my_subject_cn\r\n");
		sl_send_reply("200", "OK");
		exit;
	}
	sl_send_reply("404", "Not Found");
}
