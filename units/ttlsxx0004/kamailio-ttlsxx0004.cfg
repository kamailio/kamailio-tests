#!KAMAILIO
#
# TLS robustness unit test (ttlsxx0004)
#

debug=2
log_stderror=yes
fork=yes
children=2
auto_aliases=no

listen=tls:127.0.0.1:5061

enable_tls=yes
tcp_connection_lifetime=30
tcp_max_connections=256
tls_max_connections=256

loadmodule "sl.so"
loadmodule "pv.so"
loadmodule "ctl.so"
loadmodule "tls.so"

modparam("tls", "config", "__TLS_CFG__")

request_route {
	if($rm == "OPTIONS") {
		sl_send_reply("200", "OK");
		exit;
	}
	sl_send_reply("404", "Not Found");
}
