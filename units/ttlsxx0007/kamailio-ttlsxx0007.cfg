#!KAMAILIO
#
# TLS outbound server certificate verification unit test (ttlsxx0007)
#
# A request received over UDP is relayed over TLS to one of the local
# TLS sockets (header X-Port), using the TLS client profile selected by
# server_id (header X-Profile). The TLS sockets answer with 200.
#

debug=2
log_stderror=yes
fork=yes
children=2
auto_aliases=no

listen=udp:127.0.0.1:5060
listen=tls:127.0.0.1:5061
listen=tls:127.0.0.1:5062
listen=tls:127.0.0.1:5063

enable_tls=yes
tls_connection_match_domain=yes
tcp_connect_timeout=2

loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "pv.so"
loadmodule "tls.so"

modparam("tm", "fr_timer", 3000)
modparam("tm", "fr_inv_timer", 3000)
modparam("tls", "config", "__TLS_CFG__")
modparam("tls", "xavp_cfg", "tls")

request_route {
	if($proto == "udp") {
		$xavp(tls=>server_id) = $hdr(X-Profile);
		$du = "sip:127.0.0.1:" + $hdr(X-Port) + ";transport=tls";
		if(!t_relay()) {
			sl_reply_error();
		}
		exit;
	}
	sl_send_reply("200", "OK");
	exit;
}
