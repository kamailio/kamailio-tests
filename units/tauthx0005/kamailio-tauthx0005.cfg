#!KAMAILIO

debug=3
children=2

loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "sl.so"
loadmodule "pv.so"
loadmodule "xlog.so"
loadmodule "textops.so"
loadmodule "auth_xkeys.so"

# ----- auth_xkeys params -----
# Fixed key value, so the matching HMAC can be reproduced independently
# (with the openssl command line tool) and tampered with by the test driver.
modparam("auth_xkeys", "xkey", "id=kid1;name=key1;value=secretkey")

request_route {
	# Verify the token carried in the request against the HMAC-SHA256 of the
	# fixed data string keyed with the fixed key value. The test driver sends
	# one request with the valid token (must PASS) and one with a tampered
	# token of the same length (must FAIL).
	if (is_present_hf("X-AuthXKeys-Token")) {
		if (auth_xkeys_check("X-AuthXKeys-Token", "kid1", "hmac-sha256", "teststring")) {
			xlog("L_INFO", "AUTHX check result: PASS\n");
			sl_send_reply("200", "ok");
		} else {
			xlog("L_INFO", "AUTHX check result: FAIL\n");
			sl_send_reply("403", "forbidden");
		}
		exit;
	}

	sl_send_reply("200", "ok");
	exit;
}
