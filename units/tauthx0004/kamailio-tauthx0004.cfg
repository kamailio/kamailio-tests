#!KAMAILIO

debug=3
children=2

loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "sl.so"
loadmodule "pv.so"
loadmodule "xlog.so"
loadmodule "textops.so"
loadmodule "auth_xkeys.so"

# ----- auth_xkeys params -----
# Fixed key value, so the produced HMAC can be reproduced independently
# (e.g. with the openssl command line tool) and compared.
modparam("auth_xkeys", "xkey", "id=kid1;name=key1;value=secretkey")

request_route {
	# On the request forwarded to ourselves the token header is present:
	# log its value so the test can compare it with an externally computed HMAC.
	if (is_present_hf("X-AuthXKeys-Token")) {
		xlog("L_INFO", "xkeys token=$hdr(X-AuthXKeys-Token)\n");
		sl_send_reply("200", "ok");
		exit;
	}

	# First pass: add the HMAC token over a fixed data string and forward to self.
	auth_xkeys_add("X-AuthXKeys-Token", "kid1", "hmac-sha256", "teststring");
	setdsturi("sip:127.0.0.1:5060");
	forward();
	exit;
}
