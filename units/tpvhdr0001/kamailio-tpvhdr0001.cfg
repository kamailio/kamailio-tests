#!KAMAILIO

children=1

loadmodule "kex.so"
loadmodule "jsonrpcs.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "pv_headers.so"
loadmodule "textops.so"
loadmodule "xlog.so"

modparam("jsonrpcs", "pretty_format", 1)
# default values
modparam("pv_headers", "xavi_name", "headers")
modparam("pv_headers", "header_value_size", 1024)
modparam("pv_headers", "header_apply_flag", 28)
modparam("pv_headers", "skip_headers", "Record-Route,Via,Route,Content-Length,Max-Forwards,CSeq")
modparam("pv_headers", "split_headers", "")
modparam("pv_headers", "auto_msg", 1)

request_route {
    if (!is_method("MESSAGE")) exit;

    pv_xavi_print();

    if($x_tu == "sip:test1test@127.0.0.1") {
        xlog("test$var(t): OK\n");
    } else {
        xlog("test$var(t): $x_tu\n");
    }
    $var(t) = $var(t) + 1;

    if(!pv_isset("$x_tn")) {
        xlog("test$var(t): OK\n");
    } else {
        xlog("test$var(t): $x_tn\n");
    }
    $var(t) = $var(t) + 1;

    $x_tu = 'Andres <sip:test1test@127.0.0.1>';
    if($x_tu == 'sip:test1test@127.0.0.1') {
        xlog("test$var(t): OK\n");
    } else {
        xlog("test$var(t): $x_tu\n");
    }
    $var(t) = $var(t) + 1;

    $x_tn = "WhatsUP!! Man";
    if($x_tn == "WhatsUP!! Man") {
        xlog("test$var(t): OK\n");
    } else {
        xlog("test$var(t): $x_tn\n");
    }
    $var(t) = $var(t) + 1;

    pv_unset("$x_tn");
    if(!pv_isset("$x_tn") && $x_tu == "sip:test1test@127.0.0.1") {
        xlog("test$var(t): OK\n");
    } else {
        xlog("test$var(t): $x_tn\n");
    }
    $var(t) = $var(t) + 1;

    $x_tn = "";
    if(!pv_isset("$x_tn")) {
        xlog("test$var(t): OK\n");
    } else {
        xlog("test$var(t): $x_tn\n");
    }
    $var(t) = $var(t) + 1;

    pv_unset("$x_tu");
    if(pv_isset("$x_tu") && $x_tu == "sip:test1test@127.0.0.1") {
        xlog("test$var(t): OK\n");
    } else {
        xlog("test$var(t): $x_tu\n");
    }
    $var(t) = $var(t) + 1;

    $x_tu = "";
    if(pv_isset("$x_tu") && $x_tu == "sip:test1test@127.0.0.1") {
        xlog("test$var(t): OK\n");
    } else {
        xlog("test$var(t): $x_tn\n");
    }
    $var(t) = $var(t) + 1;

    pv_unset("$x_tU");
    if($x_tu == "sip:test1test@127.0.0.1") {
        xlog("test$var(t): OK\n");
    } else {
        xlog("test$var(t): $x_tn\n");
    }
    $var(t) = $var(t) + 1;

    $x_tU = "";
    if($x_tu == "sip:test1test@127.0.0.1") {
        xlog("test$var(t): OK\n");
    } else {
        xlog("test$var(t): $x_tn\n");
    }
    $var(t) = $var(t) + 1;

    $x_tu = "<sip:test2test@127.2.0.2>";
    if($x_tu == "sip:test2test@127.2.0.2") {
        xlog("test$var(t): OK\n");
    } else {
        xlog("test$var(t): $x_tn\n");
    }
    $var(t) = $var(t) + 1;

    $x_tU = "test3test";
    if($x_tu == "sip:test3test@127.2.0.2") {
        xlog("test$var(t): OK\n");
    } else {
        xlog("test$var(t): $x_tn\n");
    }
    $var(t) = $var(t) + 1;

    $x_td = "127.0.0.2";
    if($x_tu == "sip:test3test@127.0.0.2") {
        xlog("test$var(t): OK\n");
    } else {
        xlog("test$var(t): $x_tn\n");
    }
    $var(t) = $var(t) + 1;

    pv_unset("$x_td");
    if($x_tu == "sip:test3test@127.0.0.2") {
        xlog("test$var(t): OK\n");
    } else {
        xlog("test$var(t): $x_tn\n");
    }
    $var(t) = $var(t) + 1;
    pv_xavi_print();

    send_reply("200", "OK");
}
